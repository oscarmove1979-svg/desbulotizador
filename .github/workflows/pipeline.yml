name: Canalización automática sin publicación
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 10 * * *'
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ejecutar pruebas
        run: |
          mkdir -p output
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee output/tests.log
      - name: Mostrar diagnóstico de pruebas
        if: failure()
        run: |
          echo "## Pruebas: ejecución fallida" >> "$GITHUB_STEP_SUMMARY"
          echo "Consultar tests.log en los artefactos para localizar el error." >> "$GITHUB_STEP_SUMMARY"
      - name: Recoger candidatos
        run: python -m src.discovery
      - name: Construir cola
        run: python -m src.queue
      - name: Preparar expedientes sin veredicto
        run: python -m src.dossier
      - name: Verificar invariantes de la cola
        run: python -m src.guardrails
      - name: Generar informe bloqueado
        run: python -m src.report
      - name: Generar tablero de revision
        run: python -m src.review_board
      - name: Preparar guion de voz sin sintetizar
        run: python -m src.voice
      - name: Auditar bloqueo editorial de todos los artefactos
        run: python -m src.safety_audit
      - name: Generar vídeo diagnóstico sin narración
        run: python -m src.video
      - name: Instalar sintetizador de voz experimental
        continue-on-error: true
        run: python -m pip install edge-tts
      - name: Probar narración neural y registrar resultado
        run: python -m src.voice_job
      - name: Validar MP4 generado
        run: python -m src.quality_gate
      - name: Registrar métricas del proceso
        run: python -m src.metrics
      - name: Resumir resultados en GitHub Actions
        if: always()
        run: |
          if [ -f output/voice_status.json ] && [ -f output/video_quality.json ] && [ -f output/metrics.json ]; then
            python -m src.pipeline_summary
          else
            echo "Pipeline incompleto: faltan artefactos para el resumen" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-sin-publicacion
          path: |
            output/tests.log
            output/discovery.json
            output/queue.json
            output/dossiers.json
            output/preview.mp4
            output/preview_narrated.mp4
            output/voice.mp3
            output/voice_status.json
            output/video_quality.json
            output/voice_plan.json
            output/metrics.json
            output/pipeline_summary.json
            output/report.json
            output/review_board.md
          retention-days: 7
