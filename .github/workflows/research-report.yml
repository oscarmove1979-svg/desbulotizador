name: Informe de investigación seguro
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Generar informe sin publicar
        run: python -m src.report
      - uses: actions/upload-artifact@v4
        with:
          name: informe-seguro
          path: output/report.json
          retention-days: 7
