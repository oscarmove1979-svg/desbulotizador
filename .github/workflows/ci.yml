name: Comprobaciones automáticas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Evaluar caso ficticio
        run: python -m src.desbulotizador
      - name: Guardar resultado sin publicar
        uses: actions/upload-artifact@v4
        with:
          name: evaluacion
          path: output/result.json
